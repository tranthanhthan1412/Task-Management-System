name: taskpilot
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:5001"
    environment:
      NODE_ENV: production
      PORT: "5001"
      CLIENT_URL: http://localhost:${APP_PORT:-3000}
      COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?Run npm run docker:setup first}
      JWT_EXPIRES_IN: 7d
      MONGODB_CONNECTIONSTRING: mongodb://mongo:27017/taskpilot
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
volumes:
  mongo-data:
